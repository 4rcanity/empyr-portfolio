<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Empyr — Redirect</title>
    <script>
      (function () {
        var match = location.pathname.match(/^\/(nl|en)\/minigames\/frenzy\/(?:room|table)\/([^/]+)\/?$/);
        if (match) {
          location.replace('/' + match[1] + '/minigames/frenzy/play?code=' + encodeURIComponent(match[2]));
          return;
        }
        location.replace('/nl/');
      })();
    </script>
  </head>
  <body style="background:#07070b;color:#8a899b;font-family:ui-monospace,monospace;padding:2rem;text-align:center;">
    <p>Redirecting…</p>
  </body>
</html>
