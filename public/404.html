<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Empyr — Redirect</title>
    <script>
      (function () {
        // Pretty room links (/minigames/<game>/room/<code>) are rewritten onto the
        // static play page, since GitHub Pages cannot serve dynamic routes.
        var match = location.pathname.match(
          /^\/(nl|en)\/minigames\/(frenzy|uno|monopoly)\/(?:room|table)\/([^/]+)\/?$/
        );
        if (match) {
          location.replace(
            '/' + match[1] + '/minigames/' + match[2] + '/play?code=' + encodeURIComponent(match[3])
          );
          return;
        }
        location.replace('/nl/');
      })();
    </script>
  </head>
  <body style="background:#07070b;color:#8a899b;font-family:ui-monospace,monospace;padding:2rem;text-align:center;">
    <p>Redirecting…</p>
  </body>
</html>
